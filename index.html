<script>
/* =====================================================================
   SAUVE LE ROI – match-3 + évasion chronométrée
   - Glisse un bloc (ou touche deux blocs voisins) pour les échanger.
     L'échange doit former un alignement de 3 ou plus (horizontal / vertical).
     Tu peux aussi pousser un bloc de côté dans un vide : il tombe et peut
     former un alignement en bas.
   - Les alignements éclatent, les blocs au-dessus tombent, et ça peut
     déclencher des réactions en chaîne.
   - Les pierres tombent dans les vides et sortent par le bas de l'écran.
   - Victoire : plus aucune pierre. Défaite : le serpent atteint le roi.
   ===================================================================== */
// ---------- Niveaux : chaque victoire passe au niveau suivant, plus dur ----------
let level = 1;
try { level = Math.max(1, parseInt(localStorage.getItem('roi-level')) || 1); } catch (e) {}
let maxLevel = level;                                             // plus haut niveau débloqué
try { maxLevel = Math.max(level, parseInt(localStorage.getItem('roi-max')) || 1); } catch (e) {}
const starsOf = L => { try { return parseInt(localStorage.getItem('roi-stars-' + L)) || 0; } catch (e) { return 0; } };
let coins = 0, inv = { shuf: 0, undo: 0, drill: 0, zap: 0, bomb: 0 };            // pièces et stock d'objets (conservés)
try { coins = Math.max(0, parseInt(localStorage.getItem('roi-coins')) || 0); Object.assign(inv, JSON.parse(localStorage.getItem('roi-inv') || '{}')); } catch (e) {}
const saveWallet = () => { try { localStorage.setItem('roi-coins', coins); localStorage.setItem('roi-inv', JSON.stringify(inv)); } catch (e) {} };
const addCoins = n => { coins += n; levelCoins += n; saveWallet(); };
function unlock(L) { if (L > maxLevel) { maxLevel = L; try { localStorage.setItem('roi-max', L); } catch (e) {} } }
const levelTime = L => Math.max(40, 100 - 10 * (L - 1));          // secondes avant que le serpent atteigne le roi
const levelNeed = L => L < 3 ? 1 : L < 6 ? 2 : 3;                 // colonnes à libérer en bas pour que les pierres s'écoulent
const levelColors = L => L < 3 ? 3 : 4;                           // 4e couleur dès le niveau 3
const levelIce = L => L < 2 ? 0 : Math.min(12, 2 * (L - 1));      // blocs sous glace dès le niveau 2
const PENALTY = 3;                                                // secondes perdues pour un échange raté (dès le niveau 2)
const levelStart = L => Math.min(.6, .35 + .03 * (L - 1));        // le serpent démarre de plus en plus déroulé
let SNAKE_TIME = levelTime(level);
const TICK = 0.07;         // un pas de chute toutes les 70 ms
const COLS = 8, ROWS = 13, TOP = 7;   // la grille de blocs occupe les lignes 7 à 12

// Légende : . vide | C solide (décor) | P pierre | 1-4 blocs de couleur | a-d blocs sous glace (couleur 1-4)
// Seules les 7 premières lignes (décor + pierres) sont lues ici : la grille de blocs est générée à chaque niveau.
const LEVEL = [
  "CCCCCPPP",
  "CCCCCPPP",
  "CCCCCPPP",
  "CCCCCPPP",
  "CCCCCPPP",
  "CCPPPPPP",
  "CCPPPPPP",
  "12331221",
  "21132312",
  "33211323",
  "12123131",
  "23312213",
];
const isBlock = ch => ch >= '1' && ch <= '4';                   // bloc de couleur normal
const isIce = ch => ch >= 'a' && ch <= 'd';                     // bloc sous glace : ne s'échange pas, fond si un alignement éclate à côté
const iceColor = ch => String.fromCharCode(ch.charCodeAt(0) - 48);  // 'a' -> '1' ...
const isSpecial = ch => ch === 'D' || ch === 'B' || ch === 'Z';   // D = foreuse (colonne), Z = éclair (ligne), B = bombe (3×3)
const isSolid = ch => isBlock(ch) || isIce(ch) || isSpecial(ch);                 // occupe la case (gravité, brèche)
const parseLevel = rows => rows.map(r => r.split(''));
const inGrid = (r, c) => r >= TOP && r < ROWS && c >= 0 && c < COLS;

// ---------- Sons (générés, aucun fichier) ----------
let audioCtx = null;
function initAudio() {
  try { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function beep(freq, dur = .1, type = 'sine', vol = .25, to = freq) {
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime, o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t + dur);
  } catch (e) {}
}
const playSwap = () => beep(300, .09, 'triangle', .2, 450);
const playNope = () => beep(190, .18, 'sawtooth', .1, 120);
const playPop  = n => beep(380 + n * 90, .14, 'sine', .28, (380 + n * 90) * 1.6);   // plus aigu à chaque réaction en chaîne
function playWin() { [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => setTimeout(() => beep(f, .25, 'sine', .2), i * 100)); }

// ---------- Règles du match-3 ----------
// Cases appartenant à un alignement d'au moins 3 blocs identiques
function checkMatches(g) {
  const out = new Set();
  for (let r = TOP; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = g[r][c]; if (!isBlock(ch)) continue;
    if (c + 2 < COLS && g[r][c + 1] === ch && g[r][c + 2] === ch) [0, 1, 2].forEach(i => out.add(r * COLS + c + i));
    if (r + 2 < ROWS && g[r + 1][c] === ch && g[r + 2][c] === ch) [0, 1, 2].forEach(i => out.add((r + i) * COLS + c));
  }
  return out;
}
// Fait tomber les blocs (uniquement) jusqu'à stabilité : sert à tester un coup à l'avance
function settleBlocks(g) {
  let moved = true;
  while (moved) { moved = false;
    for (let r = ROWS - 2; r >= TOP; r--) for (let c = 0; c < COLS; c++)
      if (isSolid(g[r][c]) && g[r + 1][c] === '.') { g[r + 1][c] = g[r][c]; g[r][c] = '.'; moved = true; } }
}
// Un échange est possible entre deux blocs de couleurs différentes, ou en poussant un bloc de côté dans le vide
function legalPair(g, r, c, r2, c2) {
  if (!inGrid(r, c) || !inGrid(r2, c2) || Math.abs(r - r2) + Math.abs(c - c2) !== 1) return false;
  const a = g[r][c], b = g[r2][c2];
  if (!isBlock(a) && !isSpecial(a)) return false;
  if (isBlock(b) || isSpecial(b)) return isSpecial(a) || isSpecial(b) || a !== b;
  return b === '.' && r === r2;
}
function swapMakesMatch(g, r, c, r2, c2) {
  if ((isSpecial(g[r][c]) || isSpecial(g[r2][c2])) && g[r][c] !== '.' && g[r2][c2] !== '.') return true;   // échanger un bloc spécial le déclenche
  const h = g.map(x => x.slice());
  [h[r][c], h[r2][c2]] = [h[r2][c2], h[r][c]];
  settleBlocks(h);
  return checkMatches(h).size > 0;
}
function findMove(g) {            // premier coup valable [r, c, r2, c2] ou null
  for (let r = TOP; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    if (!isBlock(g[r][c])) continue;
    for (const [dr, dc] of [[0, 1], [0, -1], [1, 0], [-1, 0]])
      if (legalPair(g, r, c, r + dr, c + dc) && swapMakesMatch(g, r, c, r + dr, c + dc)) return [r, c, r + dr, c + dc];
  }
  return null;
}
function shuffleBlocks(g) {       // mélange les couleurs entre les blocs existants (positions inchangées)
  const pos = [];
  for (let r = TOP; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (isBlock(g[r][c])) pos.push([r, c]);
  const cols = pos.map(([r, c]) => g[r][c]);
  for (let i = cols.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [cols[i], cols[j]] = [cols[j], cols[i]]; }
  pos.forEach(([r, c], i) => { g[r][c] = cols[i]; });
}
// Anti-blocage : s'il reste assez de blocs, on les mélange ; sinon (derniers blocs qui ne peuvent
// plus s'aligner) ils se dissolvent tous : les pierres tombent d'elles-mêmes et le roi peut passer.
function dissolveAll(g) {
  for (let r = TOP; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    let ch = g[r][c]; if (!isSolid(ch)) continue;
    if (isIce(ch)) ch = iceColor(ch);
    pops.push({ r, c, ch, t: 0 }); burst(c + .5, r + .5, COLORS[ch] || '#fff2a8', 8);
    g[r][c] = '.'; offX[r][c] = offY[r][c] = swX[r][c] = swY[r][c] = 0;
  }
  lock = .4; chain = 0; hint = null; beep(520, .5, 'sine', .25, 1100);
  return 'Derniers blocs dissous : la voie est libre !';
}
function resolveDeadlock(g) {
  const n = g.reduce((k, row) => k + row.filter(isBlock).length, 0);
  if (n > 12) {
    for (let t = 0; t < 40; t++) { shuffleBlocks(g); if (checkMatches(g).size || findMove(g)) return 'Mélange automatique !'; }
  }
  return dissolveAll(g);
}
const hasBlocks = g => g.some(row => row.some(isSolid));

// ---------- Simulation : gravité des blocs puis des pierres ----------
let offX, offY, swX, swY;        // décalages d'animation (en cases) : chute / échange
const mkA = () => Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
function moveCell(r, c, r2, c2, dx, dy) {        // déplace un contenu en gardant son animation
  grid[r2][c2] = grid[r][c]; grid[r][c] = '.';
  offX[r2][c2] = offX[r][c] + dx; offY[r2][c2] = offY[r][c] + dy;
  swX[r2][c2] = swX[r][c]; swY[r2][c2] = swY[r][c];
  offX[r][c] = offY[r][c] = swX[r][c] = swY[r][c] = 0;
}
function stepGravity(g) {
  let moved = false, blocksMoved = false; const evac = [];
  for (let r = ROWS - 2; r >= TOP; r--) for (let c = 0; c < COLS; c++)
    if (isSolid(g[r][c]) && g[r + 1][c] === '.') { moveCell(r, c, r + 1, c, 0, -1); moved = blocksMoved = true; }
  for (let r = ROWS - 1; r >= 0; r--) for (let c = 0; c < COLS; c++) {
    if (g[r][c] !== 'P') continue;
    if (r < TOP) continue;                        // pierres du canal : retenues par la porte tant que la brèche n'est pas ouverte
    if (r === ROWS - 1) { g[r][c] = '.'; offX[r][c] = offY[r][c] = 0; evac.push(c); moved = true; }
    else if (g[r + 1][c] === '.') { moveCell(r, c, r + 1, c, 0, -1); moved = true; }
    else if (c > 0 && g[r][c - 1] === '.') { moveCell(r, c, r, c - 1, 1, 0); moved = true; }
  }
  return { moved, blocksMoved, evac };
}
const countStones = g => g.reduce((n, row) => n + row.filter(ch => ch === 'P').length, 0);

// ---------- État ----------
const $ = id => document.getElementById(id);
const cv = $('board'), ctx = cv.getContext('2d');
// ---------- Thèmes : changent tous les 2 niveaux ----------
const THEMES = [

}

// ---------- Rendu ----------
const ease = v => { const a = Math.min(Math.abs(v), 1); return Math.sign(v) * a * a * (3 - 2 * a); };
function cellOffset(r, c) {                         // décalage total d'une case, en cases
  let dx = offX[r][c] + ease(swX[r][c]), dy = offY[r][c] + ease(swY[r][c]);
  if (bounce) {
    const s = Math.sin(Math.PI * Math.min(bounce.t / bounce.dur, 1)), vx = bounce.c2 - bounce.c, vy = bounce.r2 - bounce.r;
    if (r === bounce.r && c === bounce.c) { dx += vx * s; dy += vy * s; }
    else if (r === bounce.r2 && c === bounce.c2 && isBlock(grid[r][c])) { dx -= vx * s; dy -= vy * s; }
  } else if (hint) {                                // petit frétillement des deux blocs conseillés
    const w = Math.sin(performance.now() / 90) * .07, vx = hint[3] - hint[1], vy = hint[2] - hint[0];
    if (r === hint[0] && c === hint[1]) { dx += vx * w; dy += vy * w; }
    else if (r === hint[2] && c === hint[3] && isBlock(grid[r][c])) { dx -= vx * w; dy -= vy * w; }
  }
  if (jitter > 0 && isSolid(grid[r][c])) { dx += (Math.random() - .5) * jitter * .35; dy += (Math.random() - .5) * jitter * .35; }   // secousse du mélange
  return [dx, dy];
}
function draw() {
  const tNow = performance.now();
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - .5) * shake * cs * .25, (Math.random() - .5) * shake * cs * .25);   // tremblement
  ctx.drawImage(bg, 0, 0, W, H);
  const p = Math.min(elapsed / SNAKE_TIME, 1);
  kingBlink = status !== 'lost' && (tNow % 3300) < 140;
  drawSnake(p);
  const run = status === 'won' ? Math.min(Math.max(winT - .6, 0) / 1.4, 1) : 0;
  const hop = run > 0 && run < 1 ? -Math.abs(Math.sin(winT * 14)) * cs * .25 : 0;
  if (status !== 'won') {                           // lueur vacillante de la lampe autour du roi
    const gx = kingX, gy = kingY - cs * .5, fl = .2 + .06 * Math.sin(tNow / 90) + .03 * Math.sin(tNow / 37);
    const gl = ctx.createRadialGradient(gx, gy, 2, gx, gy, cs * 1.3);
    gl.addColorStop(0, `rgba(255,214,120,${fl})`); gl.addColorStop(1, 'rgba(255,214,120,0)');
    ctx.fillStyle = gl; ctx.fillRect(gx - cs * 1.4, gy - cs * 1.4, cs * 2.8, cs * 2.8);
  }
  const scared = p > .7 && status === 'play';        // le roi tremble quand le serpent approche
  const tr = scared ? Math.sin(tNow / 28) * cs * .02 * (.4 + (p - .7) / .3) : 0;
  const bob = status === 'play' ? Math.sin(tNow / 450) * cs * .012 : 0, joy = kingJoy > 0 && status === 'play' ? -Math.sin((1 - kingJoy / .5) * Math.PI) * cs * .22 : 0;
  drawKing(kingX + run * cs * 5.2 + tr, kingY + hop + bob + joy, p > .75 && status !== 'won', run > 0 && run < 1 ? .12 : 0);
  if (scared && p > .75) {                           // « ! » d'inquiétude au-dessus du roi
    const k = 1 + .15 * Math.sin(tNow / 110);
    ctx.save(); ctx.translate(kingX + cs * .55, kingY - cs * 1.3); ctx.scale(k, k);
    ctx.font = `800 ${Math.round(cs * .6)}px "Bricolage Grotesque", sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = cs * .12; ctx.strokeStyle = 'rgba(60,0,10,.85)'; ctx.strokeText('!', 0, 0); ctx.fillStyle = '#ff3b5c'; ctx.fillText('!', 0, 0); ctx.restore();
  }
  drawPin(status === 'won' ? Math.min(winT / .6, 1) * cs * 2.2 : 0);
  drawAmbient(tNow);

  const now = performance.now();
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c]; if (ch !== 'P' && !isSolid(ch)) continue;
    const [dx, dy] = cellOffset(r, c), x = ox + (c + dx) * cs, y = oy + (r + dy) * cs;
    if (ch === 'P') { ctx.drawImage(sprPeb[(r * 7 + c * 13) % 5], x, y, cs, cs); continue; }
    if (isIce(ch)) { ctx.drawImage(sprIce[iceColor(ch)], x, y, cs, cs); continue; }
    if (selected && selected[0] === r && selected[1] === c) {          // bloc sélectionné : léger gonflement pulsé + liseré
      const s = 1.06 + .05 * Math.sin(now / 120), w = cs * s;
      ctx.drawImage(sprLit[ch], x - (w - cs) / 2, y - (w - cs) / 2, w, w);
    } else ctx.drawImage(sprTile[ch], x, y, cs, cs);
    if (isSpecial(ch)) {                            // halo pulsé : on voit tout de suite que c'est spécial
      ctx.save(); ctx.strokeStyle = `rgba(255,255,255,${.35 + .35 * Math.sin(now / 160 + c)})`; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.roundRect(x + 2, y + 2, cs - 4, cs - 4, cs * .22); ctx.stroke(); ctx.restore();
    }
  }
  {                                                 // porte sous le canal de pierres : elle s'ouvre dès que la brèche est ouverte
    const open = drainAt ? Math.min(1, (tNow - drainAt) / 450) : (status === 'won' ? 1 : 0);
    const gx = ox + 2 * cs + 2, gy = oy + TOP * cs - 3, gw = (6 * cs - 4) * (1 - open);
    if (gw > 1) {
      const gg = ctx.createLinearGradient(0, gy, 0, gy + 7);
      gg.addColorStop(0, '#c8f8ff'); gg.addColorStop(1, '#1aa6cc');
      ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.fillRect(gx + 2, gy + 3, gw, 7);
      ctx.fillStyle = gg; ctx.beginPath(); ctx.roundRect(gx, gy, gw, 7, 3); ctx.fill();
    }
  }
  if (hint && status === 'play' && !paused) {       // aide : contour clignotant, bloc fantôme et flèche vers la case d'arrivée
    const [hr, hc, hr2, hc2] = hint, pulse = .6 + .35 * Math.sin(tNow / 140);
    ctx.strokeStyle = `rgba(255,255,255,${pulse})`; ctx.lineWidth = 3;
    for (const [qr, qc] of [[hr, hc], [hr2, hc2]]) { ctx.beginPath(); ctx.roundRect(ox + qc * cs + 2, oy + qr * cs + 2, cs - 4, cs - 4, cs * .22); ctx.stroke(); }
    if (grid[hr2][hc2] === '.' && isBlock(grid[hr][hc])) {          // case vide : on montre où le bloc va atterrir
      ctx.save(); ctx.globalAlpha = .45; ctx.drawImage(sprTile[grid[hr][hc]], ox + hc2 * cs, oy + hr2 * cs, cs, cs); ctx.restore();
    }
    const k = (tNow % 900) / 900, ax = ox + (hc + .5 + (hc2 - hc) * k) * cs, ay = oy + (hr + .5 + (hr2 - hr) * k) * cs, ang = Math.atan2(hr2 - hr, hc2 - hc);
    ctx.save(); ctx.translate(ax, ay); ctx.rotate(ang); ctx.fillStyle = `rgba(255,255,255,${.9 - .5 * k})`;
    ctx.beginPath(); ctx.moveTo(cs * .16, 0); ctx.lineTo(-cs * .1, -cs * .15); ctx.lineTo(-cs * .1, cs * .15); ctx.closePath(); ctx.fill(); ctx.restore();
  }
  if (selected && status === 'play' && !paused) {   // bloc sélectionné : les cases vides voisines où on peut le pousser
    const [sr, sc] = selected;
    for (const dc of [-1, 1]) {
      const nc = sc + dc;
      if (nc >= 0 && nc < COLS && grid[sr][nc] === '.') {
        ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = `rgba(255,255,255,${.55 + .3 * Math.sin(tNow / 150)})`; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.roundRect(ox + nc * cs + 4, oy + sr * cs + 4, cs - 8, cs - 8, cs * .22); ctx.stroke(); ctx.restore();
      }
    }
  }
  for (let c = 0; c < COLS; c++) {                  // flèches : colonnes déjà ouvertes en bas
    const ch = grid[ROWS - 1][c]; if (isSolid(ch) || ch === 'C') continue;
    const ax = ox + (c + .5) * cs, ay = oy + (ROWS - .3) * cs, pu = .55 + .25 * Math.sin(tNow / 220 + c);
    ctx.fillStyle = `rgba(60,207,110,${pu})`; ctx.beginPath(); ctx.moveTo(ax - cs * .16, ay - cs * .1); ctx.lineTo(ax + cs * .16, ay - cs * .1); ctx.lineTo(ax, ay + cs * .1); ctx.closePath(); ctx.fill();
  }
  for (const d of drain) ctx.drawImage(sprPeb[d.v], ox + d.x * cs, oy + d.y * cs, cs, cs);   // pierres en chute libre
  for (const q of pops) {                                              // éclatement : gonfle puis rétrécit en s'éclaircissant
    const t = q.t, s = t < .3 ? 1 + .35 * (t / .3) : 1.35 * (1 - (t - .3) / .7), a = t < .3 ? 1 : 1 - (t - .3) / .7;
    ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(ox + (q.c + .5) * cs, oy + (q.r + .5) * cs); ctx.scale(s, s);
    ctx.drawImage(sprLit[q.ch], -cs / 2, -cs / 2, cs, cs); ctx.restore();
  }
  for (const f of fxs) {                            // effets des blocs spéciaux
    const k = f.t, a = Math.max(0, 1 - k), px = ox + (f.c + .5) * cs, py = oy + (f.r + .5) * cs;
    ctx.save(); ctx.globalAlpha = a * .85;
    if (f.type === 'D') { const w = cs * (.9 - .5 * k); ctx.fillStyle = '#bff4ff'; ctx.fillRect(px - w / 2, oy + TOP * cs, w, (ROWS - TOP) * cs); }
    else if (f.type === 'Z') { const h = cs * (.9 - .5 * k); ctx.fillStyle = '#fff6a8'; ctx.fillRect(ox, py - h / 2, COLS * cs, h); }
    else { ctx.strokeStyle = '#ffb347'; ctx.lineWidth = cs * .25 * a; ctx.beginPath(); ctx.arc(px, py, cs * (.4 + 1.3 * k), 0, 7); ctx.stroke(); }
    ctx.restore();
  }
  for (const q of particles) {
    ctx.globalAlpha = Math.max(0, q.life * 1.8); ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(ox + q.x * cs, oy + q.y * cs, cs * .08, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.min(.3, flash * 1.2)})`; ctx.fillRect(0, 0, W, H); }   // éclair des grosses combos
  if (status === 'lost') {                          // défaite : l'écran rougit en pulsant
    ctx.fillStyle = `rgba(200,0,30,${Math.min(.38, winT * .7) * (.8 + .2 * Math.sin(tNow / 120))})`; ctx.fillRect(0, 0, W, H);
  }
  for (const f of floats) {                         // textes flottants : « Super ! », « Dégel ! », « +3 s »
    const k = f.t / 1.1, sc = .6 + .5 * Math.min(1, f.t / .15);
    ctx.save(); ctx.globalAlpha = Math.max(0, 1 - Math.max(0, (k - .6) / .4)); ctx.translate(f.x, f.y - f.t * cs * 1.3); ctx.scale(sc, sc);
    ctx.font = `800 ${Math.round(cs * .75)}px "Bricolage Grotesque", sans-serif`; ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.lineWidth = cs * .15; ctx.strokeStyle = 'rgba(60,20,0,.85)'; ctx.strokeText(f.txt, 0, 0); ctx.fillStyle = f.color; ctx.fillText(f.txt, 0, 0);
    ctx.restore();
  }
  for (const q of confetti) {                       // confettis de victoire
    ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.fillStyle = q.color; ctx.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); ctx.restore();
  }
}
function frame(now) { const dt = Math.min((now - last) / 1000, .05); last = now; update(dt); updateHud(); draw(); requestAnimationFrame(frame); }

new ResizeObserver(layout).observe(cv);
layout(); reset();
requestAnimationFrame(t => { last = t; frame(t); });

// ---------- Application installable (hors ligne) ----------
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
</script>
